## ═══════════════════════════════════════════════════════════════
## openvibe.domains — Nginx configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.domains.conf (ov-vhost-install) — keep them in sync and reload
## nginx after changing it. The Node app (port 5070, systemd unit openvibe-domains) renders every page, serves the
## API and the control panel (sign-in with OpenVibe.Network); nginx terminates TLS, redirects www → apex, rate-limits
## the API, sign-in and the panel's forms, keeps /internal and /metrics local, and compresses text.
##
## No proxy_cache: the app sets its own public Cache-Control per response. Never log request bodies here.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=domains_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=domains_search:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=domains_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=domains_forms:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.domains www.openvibe.domains;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.domains$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.domains;

    ssl_certificate     /etc/letsencrypt/live/openvibe.domains/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.domains/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://openvibe.domains$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.domains;
    include snippets/security-txt.conf;

    ssl_certificate     /etc/letsencrypt/live/openvibe.domains/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.domains/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.domains.access.log;
    error_log  /var/log/nginx/openvibe.domains.error.log;

    # Everything here is a GET; leave room for headers, not for a body.
    client_max_body_size 32k;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/problem+json image/svg+xml text/plain application/xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Network SSO session endpoints ───────────────────────
    # The navbar's session probe runs on every page view: it gets the API's budget, not sign-in's.
    location = /auth/me {
        limit_req zone=domains_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5070;
    }

    location /auth/ {
        limit_req zone=domains_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5070;
    }

    # ── The API: reads, and the control panel's proposals (POST with a person's token) ──
    # PUT, PATCH and DELETE never reach the app. Network's Action Center calls the app on loopback, not through here.
    location /api/v1 {
        limit_except GET POST { deny all; }
        limit_req zone=domains_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5070;
    }

    # ── The API's liveness, readiness and release ──────────
    location /api/ {
        limit_req zone=domains_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5070;
    }

    # ── A name query shares the app's 120/min budget ───────
    location = /search {
        limit_req zone=domains_search burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5070;
    }

    # ── The control panel's forms: connect, sync, remove, propose, decide, roll back ──
    location ~ ^/panel/(connect|c/[A-Za-z0-9_]+/(sync|remove)|z/[A-Za-z0-9_]+/[A-Za-z0-9_-]+/propose|p/[A-Za-z0-9_]+/(decide|rollback))$ {
        limit_req zone=domains_forms burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5070;
    }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:5070/metrics) ──
    location ~* ^/metrics(/|$) { return 404; }

    # ── OpenVibe.Events' delivery route: loopback only (POST /internal/events, ADR-033) ──
    location ~* ^/internal(/|$) { return 404; }

    # ── Pages, discovery, static assets, release.json ──────
    location / {
        proxy_pass http://127.0.0.1:5070;
    }

    # A short ending URL (/.dev, /.co.uk) is a page with a 301 to /tld/<ending>, not a dotfile.
    # This regex location comes before the dotfile deny below; the first regex match wins.
    location ~* ^/\.[a-z0-9-]+(\.[a-z0-9-]+)*$ {
        proxy_pass http://127.0.0.1:5070;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
